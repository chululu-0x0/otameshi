<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8px 枠画像 テーブル比較</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">TABLE FRAME TEST</p>
      <h1>8px画像 × テーブル枠 比較</h1>
      <p class="description">
        元画像はすべて8pxのまま使用し、CSSで 8 / 16 / 32 / 64px に整数倍表示しています。
      </p>
    </header>

    <section class="frame-section">
      <div class="section-heading">
        <h2>通常枠</h2>
        <p>minidit-8-1-1.png ～ minidit-8-1-9.png を使用</p>
      </div>

      <div class="comparison-grid" id="normalFrames"></div>
    </section>

    <section class="frame-section">
      <div class="section-heading">
        <h2>角画像差し替え枠</h2>
        <p>
          1・3・7・9のみ minidot-8-2kado-*.png に差し替え、
          辺と中央は通常画像を使用
        </p>
      </div>

      <div class="comparison-grid" id="cornerFrames"></div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
